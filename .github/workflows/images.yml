name: Build agent images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build
      - run: pnpm -r check
      - run: pnpm -r test

  image:
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      matrix:
        service: [innovation-man, sales-man, manager-man]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/gurkeschalesammler/ai-product-factory-${{ matrix.service }}:${{ github.sha }}-${{ matrix.platform.arch }}
          platforms: linux/${{ matrix.platform.arch }}
          provenance: true
          sbom: true
      - name: Record platform digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s' "$DIGEST" > '${{ matrix.service }}-${{ matrix.platform.arch }}.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}-${{ matrix.platform.arch }}
          path: ${{ matrix.service }}-${{ matrix.platform.arch }}.txt

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [innovation-man, sales-man, manager-man]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        env:
          IMAGE: ghcr.io/gurkeschalesammler/ai-product-factory-${{ matrix.service }}
          SOURCE_SHA: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$SOURCE_SHA" --tag "$IMAGE:latest" \
            "$IMAGE@$(cat "$SERVICE-amd64.txt")" \
            "$IMAGE@$(cat "$SERVICE-arm64.txt")"
