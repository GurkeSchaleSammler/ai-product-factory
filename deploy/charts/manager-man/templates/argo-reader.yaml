apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-argo-reader
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-argo-reader
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-argo-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "manager-man.fullname" . }}
    namespace: {{ .Release.Namespace }}
